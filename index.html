<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경제 뉴스 스크랩 & 인사이트</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { text-align: center; color: #1e293b; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 { margin-top: 0; color: var(--primary-color); font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f1f5f9; font-weight: bold; }
        .penalty-high { color: #ef4444; font-weight: bold; }
        .insight-list { list-style: none; padding: 0; }
        .insight-item { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .insight-item strong { color: var(--primary-color); }
    </style>
</head>
<body>

    <h1>📈 경제 뉴스 스크랩 팀</h1>

    <!-- 1. 오늘의 뉴스 섹션 -->
    <div class="card">
        <h2>📰 오늘의 주요 경제 뉴스</h2>
        <ul id="news-feed">
            <li><a href="#" target="_blank">한국은행, 기준금리 동결 결정... 시장 반응은?</a></li>
            <li><a href="#" target="_blank">미국 CPI 발표, 예상치 하회하며 증시 반등</a></li>
            <li><a href="#" target="_blank">금융당국, 가계부채 관리 강화 방안 발표</a></li>
        </ul>
    </div>

    <!-- 2. 인사이트 작성 섹션 -->
    <div class="card">
        <h2>💡 내 인사이트 공유하기</h2>
        <input type="text" id="memberName" placeholder="이름을 입력하세요 (예: 홍길동)">
        <input type="url" id="newsLink" placeholder="스크랩한 뉴스 링크 (URL)">
        <textarea id="insightText" rows="4" placeholder="이 뉴스를 읽고 얻은 인사이트나 의견을 자유롭게 적어주세요."></textarea>
        <button onclick="submitInsight()">게시글 등록하기</button>
    </div>

    <!-- 3. 인사이트 피드 (임시) -->
    <div class="card" style="display: none;" id="insightFeedCard">
        <h2>오늘의 인사이트</h2>
        <ul class="insight-list" id="insightList"></ul>
    </div>

    <!-- 4. 벌금 및 누락 현황 섹션 -->
    <div class="card">
        <h2>🚨 벌금 및 스크랩 현황</h2>
        <table>
            <thead>
                <tr>
                    <th>팀원</th>
                    <th>오늘 제출 여부</th>
                    <th>누락 횟수</th>
                    <th>현재 벌금</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>김팀원</td>
                    <td>✅ 완료</td>
                    <td>0회</td>
                    <td>0원</td>
                </tr>
                <tr>
                    <td>이팀원</td>
                    <td>❌ 미제출</td>
                    <td class="penalty-high">3회</td>
                    <td class="penalty-high">15,000원</td>
                </tr>
                <tr>
                    <td>박팀원</td>
                    <td>✅ 완료</td>
                    <td>1회</td>
                    <td>5,000원</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 간단한 동작을 위한 자바스크립트
        function submitInsight() {
            const name = document.getElementById('memberName').value;
            const insight = document.getElementById('insightText').value;
            
            if(!name || !insight) {
                alert('이름과 인사이트를 모두 입력해주세요!');
                return;
            }

            const list = document.getElementById('insightList');
            const item = document.createElement('li');
            item.className = 'insight-item';
            item.innerHTML = `<strong>${name}님의 인사이트:</strong><br><p>${insight}</p>`;
            
            list.prepend(item);
            document.getElementById('insightFeedCard').style.display = 'block';
            
            // 입력창 초기화
            document.getElementById('insightText').value = '';
            alert('인사이트가 성공적으로 등록되었습니다!');
        }
    </script>
</body>
</html>
